[workspace]
resolver = "3"
members = ["kernel", "kernel-v86", "pc", "runner-core", "web", "xtask"]
default-members = ["runner-core", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
debug = 1
